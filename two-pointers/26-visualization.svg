  <rect x="380" y="566" width="44" height="26" fill="#45475a" opacity="0.3" stroke="#6c7086" stroke-width="1" stroke-dasharray="4,2" rx="3"/>
  <text x="402" y="583" text-anchor="middle" fill="#6c7086" font-size="12">2</text>
