  <text x="450" y="662" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="bold">Граничные случаи</text>

  <!-- Случай 1: все одинаковые -->
  <text x="100" y="690" text-anchor="end" fill="#f9e2af" font-size="11">[1, 1, 1]:</text>
  <rect x="120" y="676" width="50" height="26" fill="#a6e3a1" opacity="0.1" stroke="#a6e3a1" stroke-width="1" rx="3"/>
  <text x="145" y="693" text-anchor="middle" fill="#a6e3a1" font-size="12">1</text>
  <rect x="178" y="676" width="50" height="26" fill="#45475a" opacity="0.3" stroke="#6c7086" stroke-width="1" stroke-dasharray="4,2" rx="3"/>
  <text x="203" y="693" text-anchor="middle" fill="#6c7086" font-size="12">1</text>
