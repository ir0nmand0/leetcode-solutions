  <text x="610" y="483" fill="#6c7086" font-size="11">3 == 3 → дубликат, пропуск</text>

  <!-- Шаг 9: fast=9, nums[3]=3 != nums[9]=4 → уникальный! -->
  <text x="60" y="524" text-anchor="end" fill="#a6e3a1" font-size="11">f=9:</text>
  <rect x="80" y="510" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="527" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="510" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="152" y="527" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="180" y="510" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="202" y="527" text-anchor="middle" fill="#cdd6f4" font-size="12">2</text>
