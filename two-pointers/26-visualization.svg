<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a6e3a1"/>
    </marker>
  </defs>

  <rect width="900" height="750" fill="#1e1e2e" rx="12"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-size="17" font-weight="bold">26. Remove Duplicates from Sorted Array — Two Pointers</text>
  <text x="450" y="50" text-anchor="middle" fill="#a6adc8" font-size="12">nums = [0, 0, 1, 1, 1, 2, 2, 3, 3, 4] → k=5, [0, 1, 2, 3, 4, ...]</text>

  <!-- Legend -->
  <rect x="150" y="62" width="14" height="12" fill="#a6e3a1" opacity="0.3" rx="2"/>
  <text x="170" y="73" fill="#a6adc8" font-size="11">Новый уникальный</text>
  <rect x="330" y="62" width="14" height="12" fill="#585b70" opacity="0.5" rx="2"/>
  <text x="350" y="73" fill="#a6adc8" font-size="11">Дубликат (пропуск)</text>
  <text x="510" y="73" fill="#f9e2af" font-size="11">Массив отсортирован → дубликаты всегда рядом</text>

  <!-- ═══════════════════════════════════════ -->
  <text x="450" y="100" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="bold">Пошаговое выполнение</text>

  <!-- Начальное состояние -->
  <text x="60" y="128" text-anchor="end" fill="#6c7086" font-size="11">Старт:</text>
  <rect x="80" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="152" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="180" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="202" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="230" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="252" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="280" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="302" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="330" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="352" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">2</text>
  <rect x="380" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="402" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">2</text>
  <rect x="430" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="452" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">3</text>
  <rect x="480" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="502" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">3</text>
  <rect x="530" y="114" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="552" y="131" text-anchor="middle" fill="#cdd6f4" font-size="12">4</text>
  <text x="102" y="109" text-anchor="middle" fill="#a6e3a1" font-size="9">slow</text>
  <text x="152" y="109" text-anchor="middle" fill="#f9e2af" font-size="9">fast</text>
  <text x="610" y="131" fill="#6c7086" font-size="11">slow=0, fast=1</text>

  <!-- Шаг 1: fast=1, nums[0]=0 == nums[1]=0 → дубликат -->
  <text x="60" y="172" text-anchor="end" fill="#6c7086" font-size="11">f=1:</text>
  <rect x="80" y="158" width="44" height="26" fill="none" stroke="#a6e3a1" stroke-width="2" rx="3"/>
  <text x="102" y="175" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="158" width="44" height="26" fill="#585b70" opacity="0.5" stroke="#f9e2af" stroke-width="2" rx="3"/>
  <text x="152" y="175" text-anchor="middle" fill="#6c7086" font-size="12">0</text>
  <rect x="180" y="158" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="202" y="175" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <text x="610" y="175" fill="#6c7086" font-size="11">0 == 0 → дубликат, пропуск</text>

  <!-- Шаг 2: fast=2, nums[0]=0 != nums[2]=1 → уникальный! -->
  <text x="60" y="216" text-anchor="end" fill="#a6e3a1" font-size="11">f=2:</text>
  <rect x="80" y="202" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="219" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="202" width="44" height="26" fill="#a6e3a1" opacity="0.2" stroke="#a6e3a1" stroke-width="2" rx="3"/>
  <text x="152" y="219" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">1</text>
  <rect x="180" y="202" width="44" height="26" fill="none" stroke="#f9e2af" stroke-width="2" rx="3"/>
  <text x="202" y="219" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <text x="152" y="197" text-anchor="middle" fill="#a6e3a1" font-size="9">slow</text>
  <text x="202" y="197" text-anchor="middle" fill="#f9e2af" font-size="9">fast</text>
  <line x1="195" y1="212" x2="170" y2="212" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="219" fill="#a6e3a1" font-size="11">0 != 1 → nums[++slow]=1</text>

  <!-- Шаг 3: fast=3, nums[1]=1 == nums[3]=1 → дубликат -->
  <text x="60" y="260" text-anchor="end" fill="#6c7086" font-size="11">f=3:</text>
  <rect x="80" y="246" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="263" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="246" width="44" height="26" fill="none" stroke="#a6e3a1" stroke-width="2" rx="3"/>
  <text x="152" y="263" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="180" y="246" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="202" y="263" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="230" y="246" width="44" height="26" fill="#585b70" opacity="0.5" stroke="#f9e2af" stroke-width="2" rx="3"/>
  <text x="252" y="263" text-anchor="middle" fill="#6c7086" font-size="12">1</text>
