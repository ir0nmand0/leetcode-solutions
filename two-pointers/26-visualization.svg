  <text x="152" y="307" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="180" y="290" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="202" y="307" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="230" y="290" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="252" y="307" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="280" y="290" width="44" height="26" fill="#585b70" opacity="0.5" stroke="#f9e2af" stroke-width="2" rx="3"/>
  <text x="302" y="307" text-anchor="middle" fill="#6c7086" font-size="12">1</text>
  <text x="610" y="307" fill="#6c7086" font-size="11">1 == 1 → дубликат, пропуск</text>

  <!-- Шаг 5: fast=5, nums[1]=1 != nums[5]=2 → уникальный! -->
  <text x="60" y="348" text-anchor="end" fill="#a6e3a1" font-size="11">f=5:</text>
  <rect x="80" y="334" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="351" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="334" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="152" y="351" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="180" y="334" width="44" height="26" fill="#a6e3a1" opacity="0.2" stroke="#a6e3a1" stroke-width="2" rx="3"/>
  <text x="202" y="351" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">2</text>
  <rect x="230" y="334" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="252" y="351" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="280" y="334" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="302" y="351" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="330" y="334" width="44" height="26" fill="none" stroke="#f9e2af" stroke-width="2" rx="3"/>
  <text x="352" y="351" text-anchor="middle" fill="#cdd6f4" font-size="12">2</text>
  <text x="202" y="329" text-anchor="middle" fill="#a6e3a1" font-size="9">slow</text>
  <text x="352" y="329" text-anchor="middle" fill="#f9e2af" font-size="9">fast</text>
  <line x1="345" y1="344" x2="220" y2="344" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="351" fill="#a6e3a1" font-size="11">1 != 2 → nums[++slow]=2</text>

  <!-- Шаг 6: fast=6, nums[2]=2 == nums[6]=2 → дубликат -->
  <text x="60" y="392" text-anchor="end" fill="#6c7086" font-size="11">f=6:</text>
  <rect x="80" y="378" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="395" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="378" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="152" y="395" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="180" y="378" width="44" height="26" fill="none" stroke="#a6e3a1" stroke-width="2" rx="3"/>
  <text x="202" y="395" text-anchor="middle" fill="#cdd6f4" font-size="12">2</text>
  <rect x="380" y="378" width="44" height="26" fill="#585b70" opacity="0.5" stroke="#f9e2af" stroke-width="2" rx="3"/>
  <text x="402" y="395" text-anchor="middle" fill="#6c7086" font-size="12">2</text>
  <text x="610" y="395" fill="#6c7086" font-size="11">2 == 2 → дубликат, пропуск</text>

  <!-- Шаг 7: fast=7, nums[2]=2 != nums[7]=3 → уникальный! -->
  <text x="60" y="436" text-anchor="end" fill="#a6e3a1" font-size="11">f=7:</text>
  <rect x="80" y="422" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="439" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="422" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="152" y="439" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="180" y="422" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="202" y="439" text-anchor="middle" fill="#cdd6f4" font-size="12">2</text>
  <rect x="230" y="422" width="44" height="26" fill="#a6e3a1" opacity="0.2" stroke="#a6e3a1" stroke-width="2" rx="3"/>
  <text x="252" y="439" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">3</text>
  <rect x="430" y="422" width="44" height="26" fill="none" stroke="#f9e2af" stroke-width="2" rx="3"/>
  <text x="452" y="439" text-anchor="middle" fill="#cdd6f4" font-size="12">3</text>
  <text x="252" y="417" text-anchor="middle" fill="#a6e3a1" font-size="9">slow</text>
  <text x="452" y="417" text-anchor="middle" fill="#f9e2af" font-size="9">fast</text>
  <line x1="445" y1="432" x2="270" y2="432" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="439" fill="#a6e3a1" font-size="11">2 != 3 → nums[++slow]=3</text>

  <!-- Шаг 8: fast=8, nums[3]=3 == nums[8]=3 → дубликат -->
  <text x="60" y="480" text-anchor="end" fill="#6c7086" font-size="11">f=8:</text>
  <rect x="80" y="466" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="483" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
  <rect x="130" y="466" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="152" y="483" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
  <rect x="180" y="466" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="202" y="483" text-anchor="middle" fill="#cdd6f4" font-size="12">2</text>
  <rect x="230" y="466" width="44" height="26" fill="none" stroke="#a6e3a1" stroke-width="2" rx="3"/>
  <text x="252" y="483" text-anchor="middle" fill="#cdd6f4" font-size="12">3</text>
  <rect x="480" y="466" width="44" height="26" fill="#585b70" opacity="0.5" stroke="#f9e2af" stroke-width="2" rx="3"/>
