  <text x="552" y="527" text-anchor="middle" fill="#cdd6f4" font-size="12">4</text>
  <text x="302" y="505" text-anchor="middle" fill="#a6e3a1" font-size="9">slow</text>
  <text x="552" y="505" text-anchor="middle" fill="#f9e2af" font-size="9">fast</text>
  <line x1="545" y1="520" x2="320" y2="520" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="527" fill="#a6e3a1" font-size="11">3 != 4 → nums[++slow]=4</text>

  <!-- Итог -->
  <line x1="40" y1="552" x2="860" y2="552" stroke="#313244" stroke-width="1"/>

  <text x="60" y="580" text-anchor="end" fill="#a6e3a1" font-size="11">Итог:</text>
