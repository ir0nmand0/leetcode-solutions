  <!-- Шаг 4: fast=4, nums[1]=1 == nums[4]=1 → дубликат -->
  <text x="60" y="304" text-anchor="end" fill="#6c7086" font-size="11">f=4:</text>
  <rect x="80" y="290" width="44" height="26" fill="none" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="102" y="307" text-anchor="middle" fill="#cdd6f4" font-size="12">0</text>
