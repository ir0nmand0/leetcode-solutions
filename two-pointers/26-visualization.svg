  <text x="610" y="580" fill="#6c7086" font-size="11">после k=5 — мусор (неважно)</text>

  <rect x="280" y="600" width="340" height="28" fill="#a6e3a1" opacity="0.12" rx="6" stroke="#a6e3a1" stroke-width="1" stroke-opacity="0.4"/>
  <text x="450" y="619" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">slow=4, return ++slow = 5 ✓</text>

